name: Remove reviewed work branches
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cleanup-reviewed-branches.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const targets = [{"name":"feature/demo-reset-command","sha":"d04104be90112bb35247a5752fa886ac566d6c07"},{"name":"feature/handwriting-answers","sha":"3c636cd937d5f040beb9e86c49213f90ce4bdd7f"},{"name":"fix/quiz-time-limit-flow","sha":"f81a8737d33e58f95563eedf8cd61c5961ef6b3c"},{"name":"fix/yuyuquizzes-new-install-package","sha":"66692d975bf482e08c30393a51ebb2b8ab4e54ac"},{"name":"refactor/expose-source-tree","sha":"b5ce58997887e7a6147c52bffb640f4c2a10a845"},{"name":"release/yuyuquizzes-0.9.0-beta.4","sha":"51a83d4fb0960b42a0f3e22fea15336ba29c19a3"},{"name":"release/0.9.0-beta.2","sha":"56244962975533583e7120b43f752c02a57f4e48"},{"name":"release/0.9.0-beta.3","sha":"07bfc19f38093f8cbcd9be8a7a8bd0764bb0ac5b"}];
            const {owner, repo} = context.repo;
            for (const target of targets) {
              if (['main', 'connect-cms-v2'].includes(target.name)) throw new Error('Protected target');
              const ref = await github.rest.git.getRef({owner, repo, ref: 'heads/' + target.name});
              if (ref.data.object.sha !== target.sha) throw new Error('Branch changed: ' + target.name);
            }
            for (const target of targets) {
              const ref = await github.rest.git.getRef({owner, repo, ref: 'heads/' + target.name});
              if (ref.data.object.sha !== target.sha) throw new Error('Branch changed: ' + target.name);
              await github.rest.git.deleteRef({owner, repo, ref: 'heads/' + target.name});
              core.info('Deleted: ' + target.name);
            }
